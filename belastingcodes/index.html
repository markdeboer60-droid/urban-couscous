          "@type": "Question",
          "name": "Wat betekent de letter in het aanslagnummer van de Belastingdienst?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "De letter in het aanslagnummer staat op de tiende positie en geeft aan om welk soort belasting het gaat. B staat voor omzetbelasting (btw), L voor loonheffing, H voor inkomstenbelasting en premie volksverzekeringen, V voor vennootschapsbelasting en T voor toeslagen."
          }
        },
        {
          "@type": "Question",
          "name": "Wat is het verschil tussen belastingcode B en F?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "B staat voor een reguliere aangifte omzetbelasting (btw). F staat voor een naheffingsaanslag omzetbelasting: dit is een aanslag die de Belastingdienst achteraf oplegt als bij een controle blijkt dat er te weinig btw is afgedragen of een te hoge teruggave is ontvangen."
          }
        },
        {
          "@type": "Question",
          "name": "Wat is het verschil tussen belastingcode L en A?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "L staat voor een reguliere loonheffingsaangifte die werkgevers periodiek indienen. A staat voor een naheffingsaanslag loonheffing: een correctie die de Belastingdienst oplegt als bij controle blijkt dat een werkgever te weinig loonheffing heeft afgedragen."
          }
        },
        {
          "@type": "Question",
          "name": "Welke belastingcodes hebben geen betalingskenmerk?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "De codes J (teruggave loonheffingen), O (teruggave omzetbelasting) en sommige overige codes hebben geen betalingskenmerk omdat ze resulteren in een teruggave. U ontvangt dan geld van de Belastingdienst in plaats van dat u betaalt."
          }
        },
        {
          "@type": "Question",
          "name": "Wat betekent T in een aanslagnummer van de Belastingdienst?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "T staat voor toeslagen. Het subnummer in het betalingskenmerk geeft aan welk type toeslag het betreft: eindigend op 1 is kinderopvangtoeslag, op 2 is huurtoeslag en op 3 is zorgtoeslag."
          }
        }
      ]
    }
