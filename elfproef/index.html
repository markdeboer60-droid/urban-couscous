        {
          "@type": "Question",
          "name": "Wat is de elfproef?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "De elfproef is een wiskundige controle waarmee de Belastingdienst en andere instanties controleren of een BSN of RSIN geldig is. De eerste 8 cijfers worden vermenigvuldigd met de gewichten 9, 8, 7, 6, 5, 4, 3 en 2. De som van die producten gedeeld door 11 geeft de rest, en dat restgetal is het 9e cijfer. Als de rest 10 is, is het nummer ongeldig."
          }
        },
        {
          "@type": "Question",
          "name": "Hoe bereken ik het 9e cijfer van een BSN?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Neem de eerste 8 cijfers van het BSN. Vermenigvuldig het eerste cijfer met 9, het tweede met 8, enzovoort tot het achtste cijfer maal 2. Tel alle uitkomsten op. Deel de som door 11 en neem de rest. Die rest is het 9e cijfer van het BSN. Als de rest 10 is, is het BSN ongeldig."
          }
        },
        {
          "@type": "Question",
          "name": "Werkt de elfproef hetzelfde voor BSN en RSIN?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Ja, de berekening is identiek voor BSN en RSIN. Beide bestaan uit 9 cijfers waarbij het 9e cijfer via dezelfde elfproef wordt bepaald. Het verschil zit in het gebruik: een BSN is een persoonsnummer voor particulieren, een RSIN is een rechtspersoonsnummer voor bedrijven en organisaties."
          }
        },
        {
          "@type": "Question",
          "name": "Wat als de elfproef uitkomt op 10?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Als de berekening een rest van 10 geeft, is er geen geldig 9e cijfer mogelijk. Het opgegeven nummer is dan ongeldig. Een correct BSN of RSIN kan nooit een elfproef-rest van 10 hebben."
          }
        }
      ]
